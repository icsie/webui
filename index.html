<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304a">
    <title>WKE 教務系統</title>
    <base href="/s115999999/">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="app-shell">
        <header class="site-header">
            <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="開啟側邊選單" aria-expanded="false">☰</button>
            <a class="brand" href="./" aria-label="WKE 教務系統首頁">
                <span class="brand-mark">W</span>
                <span>WKE 教務系統</span>
            </a>
            <div class="header-actions">
                <span class="semester">114 學年度第 1 學期</span>
                <button class="account-button" id="accountButton" type="button" aria-expanded="false">
                    <span class="avatar">王</span>
                    <span class="account-name">王老師</span>
                    <span aria-hidden="true">⌄</span>
                </button>
            </div>
        </header>

        <div class="workspace">
            <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
            <aside class="sidebar" id="sidebar" aria-label="教務系統導覽">
                <div class="sidebar-header">
                    <span class="sidebar-label" id="sidebarLabel">教師功能</span>
                    <button class="icon-button sidebar-close" id="sidebarClose" type="button" aria-label="關閉側邊選單">×</button>
                </div>
                <nav class="side-navigation" id="sideNavigation" aria-labelledby="sidebarLabel"></nav>
            </aside>

            <main class="main-content" id="mainContent">
                <div class="page-heading">
                    <div>
                        <p class="breadcrumb">主控台 / 個人總覽</p>
                        <h1>早安，王老師</h1>
                        <p class="page-intro">這裡是您的教學與校務工作摘要。</p>
                    </div>
                    <time class="today" datetime="2025-09-20">2025 年 9 月 20 日</time>
                </div>
                <section class="dashboard-grid" id="dashboardCards" aria-label="個人總覽卡片"></section>
            </main>
        </div>

        <footer class="site-footer">
            <span>WKE 教務系統</span>
            <span>需要協助？請聯絡校務資訊中心</span>
        </footer>
    </div>
    <script src="./js/app.js" defer></script>
</body>
</html>
