<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304a">
    <title>WKE 教務系統</title>
    <base href="/s115999999/">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="app-shell">
        <header class="site-header">
            <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="開啟側邊選單" aria-expanded="false">☰</button>
            <a class="brand" href="./" aria-label="WKE 教務系統首頁">
                <span class="brand-mark">W</span>
                <span>WKE 教務系統</span>
            </a>
            <div class="header-actions">
                <span class="semester">115 學年度第 1 學期</span>
                <a class="account-button" id="loginButton" href="./api/auth/google/login">
                    <span class="account-name">登入</span>
                </a>
                <div class="account-profile" id="accountProfile" hidden>
                    <button class="avatar-button" id="accountMenuToggle" type="button" aria-label="開啟帳號選單" aria-haspopup="true" aria-expanded="false" aria-controls="accountMenu" title="帳號選單">
                        <span class="avatar" id="accountAvatar" aria-hidden="true"></span>
                    </button>
                    <span class="account-name" id="accountName"></span>
                    <div class="account-menu" id="accountMenu" hidden>
                        <a href="./teacher/profile">設定</a>
                        <button id="logoutButton" type="button">登出</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="workspace">
            <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
            <aside class="sidebar" id="sidebar" aria-label="教務系統導覽">
                <nav class="side-navigation" id="sideNavigation" aria-label="教師功能導覽"></nav>
            </aside>

            <main class="main-content" id="mainContent">
                <div class="page-heading">
                    <div>
                        <p class="breadcrumb">主控台 / 個人總覽</p>
                        <h1 id="welcomeHeading">早安</h1>
                        <p class="page-intro">這裡是您的教學與校務工作摘要。</p>
                    </div>
                    <time class="today" datetime="2026-09-20">2026 年 9 月 20 日</time>
                </div>
                <section class="dashboard-grid" id="dashboardCards" aria-label="個人總覽卡片"></section>
            </main>
        </div>

        <footer class="site-footer">
            <span>WKE 教務系統</span>
            <span>需要協助？請聯絡校務資訊中心</span>
        </footer>
    </div>
    <script src="./js/app.js" defer></script>
</body>
</html>
